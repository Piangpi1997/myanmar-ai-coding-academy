name: myanmar_ai_coding_academy
description: Myanmar-first coding education Android application.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  http: ^1.3.0
  flutter_secure_storage: 9.2.4
  flutter_markdown: ^0.7.7
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar.ttf
